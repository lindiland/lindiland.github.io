<!doctype html>
<html lang="es" data-fondo="crema">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lindi · todo lo lindo de la infancia</title>
<meta name="description" content="Juguetes y accesorios para la infancia, hechos a mano en Lima. Arma tu pedido y envíalo por WhatsApp.">
<meta name="theme-color" content="#FFF8EC">
<meta property="og:title" content="Lindi · todo lo lindo de la infancia">
<meta property="og:description" content="Accesorios · juego · creatividad · espacios.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 64'%3E%3Crect x='13' y='26' width='14' height='37' rx='7' fill='%23E3714F'/%3E%3Ccircle cx='20' cy='12.5' r='11.5' fill='%23EDBA3E'/%3E%3Ccircle cx='15.6' cy='13.5' r='1.5' fill='%234A3732'/%3E%3Ccircle cx='24.4' cy='13.5' r='1.5' fill='%234A3732'/%3E%3Cpath d='M17 17q3 2.6 6 0' stroke='%234A3732' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gluten:wght@600;800&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Diseño: handoff de Claude Design (Inicio C · Tienda) sobre el Manual de Marca v4.
   Fondo crema por defecto (decisión de la dueña); el ajuste "fondo" de la hoja permite blanco o mixto. */
:root{
  color-scheme:light;
  --crema:#FFF8EC;--cacao:#4A3732;--cacao-2:#5E4E46;--cacao-3:#6B5A52;--gris:#8A7A70;--linea:#EFE4D3;--linea-pie:#E3D6C2;
  --coral:#E3714F;--coral-f:#C85A3C;--coral-p:#F8D3C8;
  --amarillo:#EDBA3E;--amarillo-f:#D29F26;--amarillo-p:#F8E6B0;
  --azul:#6690D2;--azul-f:#4A74B7;--azul-p:#D3E1F4;
  --verde:#62A05A;--verde-f:#4B8745;--verde-p:#D5E7CC;
  --rosa:#DE7596;--rosa-f:#C2547A;--rosa-p:#F9DCE5;
  --fondo:#FFFFFF;--tarjeta:#FFFFFF;--suave:#FBF6EE;
  --titulo:'Gluten',cursive;--texto:'Nunito',system-ui,sans-serif;
  --sombra:0 24px 40px -32px rgba(74,55,50,.5);
}
html[data-fondo="crema"]{--fondo:#FFF8EC;--tarjeta:#FFFDF8;--suave:#F4ECE0}
/* Mixto: página blanca (fotos y bloques de color resaltan) con tarjetas crema (calidez de marca). */
html[data-fondo="mixto"]{--fondo:#FFFFFF;--tarjeta:#FFF8EC;--suave:#FBF3E6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--fondo);color:var(--cacao);font:500 16px/1.5 var(--texto);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.has-bubble{padding-bottom:84px}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--azul-f);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--titulo);font-weight:800;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.sec{padding:64px 0 24px}
.h2{font-size:clamp(34px,4.4vw,56px)}
.lead{font-size:18px;color:var(--cacao-2)}
.kicker{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.row-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:28px}
.row-head>div{display:flex;flex-direction:column;gap:8px}
.more{font-weight:900;border-bottom:2px solid var(--cacao);padding-bottom:2px;white-space:nowrap}
.more:hover{color:var(--coral-f);border-color:var(--coral-f)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 22px;border-radius:999px;border:0;background:var(--cacao);color:var(--crema);font-weight:900;font-size:16px;text-align:center;line-height:1.15;transition:background .2s,transform .15s}
.btn:hover{background:var(--coral-f);color:var(--crema)}
.btn.light{background:var(--crema);color:var(--cacao)}
.btn.light:hover{background:var(--cacao);color:var(--crema)}
.btn.yellow{background:var(--amarillo);color:var(--cacao)}
.btn.yellow:hover{background:var(--crema)}
.btn.ring{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn.ring:hover{background:var(--cacao);color:var(--crema);box-shadow:none}
.btn.big{min-height:60px;font-size:18px;width:100%}
.btn[disabled]{opacity:.55;cursor:default}

/* Logo «lindi»: cada letra en su color; el punto de la última «i» es Lindi. */
.logo{display:inline-block;font-family:var(--titulo);font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap;font-size:var(--fs,56px)}
.logo .l1,.logo .l5{color:var(--coral)}.logo .l2{color:var(--amarillo)}.logo .l3{color:var(--azul)}.logo .l4{color:var(--verde)}
.logo.crema span{color:var(--crema)}
.logo .l5{position:relative;display:inline-block}
.logo .dot{position:absolute;left:50%;top:-.04em;width:.27em;height:.27em;margin-left:-.135em;border-radius:50%;background:var(--amarillo)}
.logo.crema .dot{background:var(--crema)}
.logo .dot i{position:absolute;top:.134em;width:.032em;height:.032em;border-radius:50%;background:var(--cacao)}
.logo .dot i:first-child{left:.066em}.logo .dot i+i{right:.066em}
.logo .dot b{position:absolute;left:.088em;top:.17em;width:.094em;height:.042em;border:.024em solid var(--cacao);border-top:none;border-radius:0 0 .094em .094em}

/* Personaje Lindi (componente LindiChar del handoff, en HTML/CSS) */
.char{display:inline-flex;flex-direction:column;align-items:center;position:relative;padding:38px 16px 24px;pointer-events:none}
.char *{position:absolute;display:block}
.char .fig{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center}
.char .head{position:relative;z-index:1;width:48px;height:48px;border-radius:50%;background:#EDBE4C}
.char .body{position:relative;width:40px;height:70px;border-radius:20px 20px 17px 17px/24px 24px 18px 18px}
.char .shadow{left:50%;bottom:2px;width:44px;height:8px;margin-left:-22px;border-radius:50%;background:rgba(74,55,50,.13)}

/* Barra de avisos y navegación */
.ann{background:var(--cacao);color:var(--crema);font-size:14px;font-weight:800;letter-spacing:.04em;text-align:center;padding:10px 16px;display:flex;justify-content:center;align-items:center;gap:10px;min-height:40px}
.ann button{background:none;border:0;color:var(--crema);opacity:.7;font-size:18px;min-width:44px;min-height:44px;margin:-8px 0;padding:0}
.nav{position:sticky;top:0;z-index:40;background:var(--fondo);box-shadow:0 1.5px 0 var(--linea)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.nav .home{display:flex;align-items:flex-end;padding-top:6px}
.links{display:flex;align-items:center;gap:24px;font-weight:800}
.links a:not(.btn):hover{color:var(--coral-f)}
.menu-btn{display:none;min-height:44px;padding:0 16px;border-radius:999px;border:0;box-shadow:inset 0 0 0 2px var(--linea);background:var(--tarjeta);font-weight:900}
@media (max-width:760px){
  .nav .wrap{min-height:64px}
  .nav .logo{--fs:42px!important}
  .menu-btn{display:inline-flex;align-items:center}
  .links{display:none;position:absolute;left:0;right:0;top:100%;background:var(--fondo);box-shadow:0 1.5px 0 var(--linea),0 20px 30px -20px rgba(74,55,50,.4);flex-direction:column;align-items:stretch;gap:0;padding:8px 24px 20px}
  .links.open{display:flex}
  .links a:not(.btn){min-height:52px;display:flex;align-items:center;font-size:18px;border-bottom:1.5px solid var(--linea)}
  .links .btn{margin-top:14px}
}

/* Hero carrusel */
.hero{position:relative;overflow:hidden;transition:background .5s,color .5s}
.hero .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:48px;align-items:center;min-height:540px;padding-top:48px;padding-bottom:44px}
.hero .txt{display:flex;flex-direction:column;gap:18px}
.hero h1{font-size:clamp(44px,5.6vw,80px);line-height:.98}
.hero .sub{font-size:19px;line-height:1.5;font-weight:700;max-width:480px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;padding-top:6px}
.hero .cta1{padding:18px 28px;font-size:17px;box-shadow:0 8px 0 -2px rgba(74,55,50,.28)}
.hero .cta1:hover{transform:translateY(-2px)}
.hero .cta2{padding:18px 26px;font-size:17px}
.dots{display:flex;align-items:center;gap:8px;padding-top:10px}
.dots button{width:10px;height:10px;border-radius:999px;border:0;padding:0;background:currentColor;opacity:.45;transition:all .3s;position:relative}
.dots button::after{content:"";position:absolute;inset:-17px -8px}
.dots button[aria-current="true"]{width:34px;opacity:1}
.dots .pause{width:auto;height:auto;min-width:44px;min-height:44px;margin:-17px 0 -17px 4px;background:none;color:inherit;opacity:.75;font-size:12px;font-weight:900;letter-spacing:-.1em}
.dots .pause::after{display:none}
.hero .pic{position:relative;height:clamp(360px,36vw,460px)}
.hero .frame{position:absolute;left:56px;right:0;top:0;bottom:0;border-radius:28px;overflow:hidden;box-shadow:0 0 0 8px rgba(255,248,236,.9)}
.sticker{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 10px 20px -8px rgba(74,55,50,.45)}
.hero .sticker{right:-10px;top:-18px;width:124px;height:124px;transform:rotate(-8deg);gap:2px}
.hero .sticker b{font-family:var(--titulo);font-weight:800;font-size:34px;line-height:1}
.hero .sticker small{font-size:9.5px;font-weight:900;letter-spacing:.08em;line-height:1.2;max-width:90px}
.hero .lindi{position:absolute;left:-14px;bottom:-12px}
@media (max-width:760px){
  .hero .wrap{min-height:0;gap:36px;padding-top:36px}
  .hero .pic{height:300px;margin:0 6px 6px 0}
  .hero .frame{left:40px}
  .hero .sticker{right:-4px;top:-14px;width:100px;height:100px}
  .hero .sticker b{font-size:27px}
  .hero .lindi{left:-18px;zoom:.85}
}

/* Fotos y rayitas (sin foto: rayitas del ámbito, nunca un hueco) */
.ph{position:relative;overflow:hidden;background:var(--suave)}
.ph>img{width:100%;height:100%;object-fit:cover}
.rayas{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(90deg,var(--rp,var(--amarillo-p)) 0 var(--rw,22px),var(--fondo) var(--rw,22px) calc(var(--rw,22px)*2.05))}
.ph .rayas+.char,.ph .ph-char{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%)}

/* Bienvenida y bloques de ámbito */
.welcome{max-width:880px;margin:0 auto;padding:72px 24px 8px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.welcome h2{color:var(--coral-f)}
.welcome p{font-size:19px;color:var(--cacao-2)}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;padding-top:40px}
.block{position:relative;display:block;height:420px;border-radius:28px;overflow:hidden;transition:transform .2s}
.block:hover{transform:translateY(-4px)}
.block .ph{position:absolute;inset:0}
.block .ph-char{bottom:96px!important}
.block .plate{position:absolute;left:20px;right:20px;bottom:20px;border-radius:20px;padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.block .plate b{display:block;font-family:var(--titulo);font-weight:800;font-size:28px;line-height:1}
.block .plate .btn{min-height:44px;padding:10px 18px;font-size:14px;flex:none}
@media (max-width:760px){.block{height:340px}}

/* Tarjetas de producto */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:32px 18px;padding-top:10px}
.grid.small{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
@media (max-width:520px){.grid,.grid.small{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}}
.card{position:relative;display:flex;flex-direction:column;gap:10px}
.card .ph{display:block;aspect-ratio:1/1;border-radius:22px;transition:transform .2s;overflow:visible}
.card .ph .clip{position:absolute;inset:0;border-radius:22px;overflow:hidden}
.card .ph:hover{transform:translateY(-4px)}
.card .ph img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:12px;bottom:12px;background:var(--cacao);color:var(--crema);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:900;letter-spacing:.08em}
.chip{position:absolute;left:12px;top:12px;border-radius:999px;padding:5px 11px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.card .sticker{right:-8px;top:-12px;width:78px;height:78px;background:var(--amarillo);color:var(--cacao);transform:rotate(8deg);font-family:var(--titulo);font-weight:800;font-size:22px;line-height:1;padding:6px;box-shadow:0 8px 16px -8px rgba(74,55,50,.5)}
.card .sticker.long{font-size:14px}
.card .sticker.xl{font-size:12px}
.card h3{font-size:23px;line-height:1.05}
.card .play{font-size:14px;line-height:1.45;color:var(--cacao-2)}
.add{margin-top:auto;min-height:48px;padding:6px 12px;border-radius:999px;border:0;background:var(--tarjeta);box-shadow:inset 0 0 0 2px var(--cacao);font-weight:900;font-size:14px;line-height:1.15;transition:background .2s}
.add:hover,.add.on{background:var(--cacao);color:var(--crema)}
@media (max-width:520px){.card h3{font-size:19px}.card .sticker{width:64px;height:64px;font-size:17px;right:-6px}.card .sticker.long{font-size:12px}.card .sticker.xl{font-size:10px}.card .play{font-size:13px}}

/* Editorial (Navidad + novedad) */
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.ed{position:relative;border-radius:28px;min-height:380px;overflow:hidden;display:flex;flex-direction:column}
.ed.blue{background:var(--azul);color:var(--crema);padding:36px;padding-right:clamp(36px,12vw,160px);gap:14px}
.ed .t{font-family:var(--titulo);font-weight:800;font-size:clamp(34px,3.8vw,48px);line-height:1}
.ed .count{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ed .count span:first-child{background:var(--crema);color:var(--cacao);border-radius:14px;padding:10px 14px;display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:900}
.ed .count b{font-family:var(--titulo);font-weight:800;font-size:30px;line-height:1}
.ed .lindi{position:absolute;right:24px;bottom:-6px}
.ed.news{background:var(--tarjeta);box-shadow:inset 0 0 0 1.5px var(--linea)}
.ed.news .top{position:relative;height:130px;flex:none}
.ed.news .in{padding:28px 36px 36px;padding-right:clamp(36px,12vw,150px);display:flex;flex-direction:column;gap:12px;flex:1}
.ed.news .t{color:var(--rosa-f);font-size:clamp(30px,3.4vw,44px)}
.ed .btn{margin-top:auto;align-self:flex-start}

/* ¿Qué buscas hoy? */
.ambs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:24px 14px}
@media (max-width:520px){.ambs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.amb{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.amb .ring{width:min(180px,38vw);height:min(180px,38vw);border-radius:50%;background:var(--tarjeta);display:flex;align-items:flex-end;justify-content:center;overflow:hidden;transition:transform .2s}
.amb:hover .ring{transform:scale(1.04)}
.amb .ring .char{margin-bottom:-8px;zoom:.72}
.amb b{font-family:var(--titulo);font-weight:800;font-size:26px;line-height:1}
.amb small{font-size:12px;font-weight:900;letter-spacing:.08em;color:var(--cacao-3)}

/* Historia */
.story{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:48px;align-items:center}
.mosaic{display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr;gap:10px;height:clamp(320px,34vw,460px)}
.mosaic .ph{border-radius:24px}
.mosaic .ph:first-child{grid-row:span 2}
.story .txt{display:flex;flex-direction:column;gap:18px}
.story .txt p{font-size:18px;line-height:1.6;color:var(--cacao-2)}
.story .quote{font-family:var(--titulo);font-weight:600;font-size:24px;line-height:1.25;color:var(--coral-f)!important}

/* Bandas */
.band{position:relative;border-radius:28px;background:var(--cacao);color:var(--crema);padding:clamp(28px,4vw,48px);padding-right:clamp(28px,16vw,220px);display:flex;flex-direction:column;gap:14px;overflow:hidden}
.band .t{font-family:var(--titulo);font-weight:800;font-size:clamp(32px,3.8vw,48px);line-height:1;color:var(--amarillo)}
.band p{font-size:18px;line-height:1.5;font-weight:700;max-width:620px}
.band .btn{align-self:flex-start}
.band .lindi{position:absolute;right:clamp(12px,5vw,64px);bottom:-6px}
@media (max-width:760px){.band{padding-bottom:150px}.band .lindi{right:16px}}

/* Cómo pedir */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.step{border-radius:22px;background:var(--tarjeta);box-shadow:inset 0 0 0 1.5px var(--linea);padding:24px;display:flex;flex-direction:column;gap:10px}
.step .n{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--titulo);font-weight:800;font-size:26px}
.step h3{font-size:26px;line-height:1.05}
.step p{font-size:15px;line-height:1.5;color:var(--cacao-2)}
.ship{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;border-radius:22px;background:var(--cacao);color:var(--crema);padding:20px 24px;margin-top:14px;font-weight:700}

/* Redes */
.social{display:flex;gap:10px;flex-wrap:wrap}
.feed{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:8px}
@media (max-width:520px){.feed{grid-template-columns:repeat(2,minmax(0,1fr))}}
.feed .ph{aspect-ratio:4/5;border-radius:14px}

/* Tienda */
.page-head{display:flex;flex-direction:column;gap:10px;padding:48px 0 0}
.page-head h1{font-size:clamp(48px,6vw,80px)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding:28px 0 32px}
.tab{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:0;background:transparent;box-shadow:inset 0 0 0 2px var(--linea);font-weight:900;font-size:15px}
.tab i{width:12px;height:12px;border-radius:50%}
.tab[aria-current="page"]{background:var(--cacao);color:var(--crema);box-shadow:none}
.empty-amb{border-radius:28px;padding:48px 40px 0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px;overflow:hidden}
.empty-amb div{display:flex;flex-direction:column;gap:12px;padding-bottom:48px;max-width:560px}
.empty-amb b{font-family:var(--titulo);font-weight:800;font-size:clamp(30px,4vw,48px);line-height:1}
.empty-amb p{font-size:17px;line-height:1.5;font-weight:700}

/* Ficha */
.crumbs{display:flex;gap:8px;flex-wrap:wrap;font-size:14px;font-weight:800;color:var(--cacao-3);padding:32px 0 24px}
.crumbs a:hover{color:var(--coral-f)}
.prod{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:48px;align-items:start}
.gallery{display:flex;flex-direction:column;gap:10px}
.gallery .main{aspect-ratio:1/1;border-radius:28px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.thumbs button{position:relative;aspect-ratio:1/1;border-radius:16px;border:0;padding:0;overflow:hidden;background:var(--suave)}
.thumbs button[aria-current="true"]{box-shadow:0 0 0 3px var(--cacao)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{display:flex;flex-direction:column;gap:20px}
.info .chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.info .chips .chip{position:static}
.info .chips small{font-size:14px;font-weight:800;color:var(--cacao-3)}
.info h1{font-size:clamp(42px,5vw,68px);line-height:.98}
.info .price{font-family:var(--titulo);font-weight:800;font-size:38px;line-height:1}

// ---------- Utilidades ----------

function readStore(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function writeStore(key, value) {
  try { if (value == null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(value)); } catch (e) { }
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
}
function money(n) {
  return 'S/' + (Math.round(n) === n ? String(n) : n.toFixed(2));
}
function items() { return (state.content && state.content.items) || []; }
function settings() { return (state.content && state.content.settings) || {}; }
function byId(id) { return items().find(p => p.id === id); }
function scopeOf(name) { return SCOPES.find(s => s.name === name || s.id === name) || SCOPES[1]; }
function priceLabel(p) { return p.price ? money(p.price) : (p.priceText || 'Por confirmar'); }
function safeUrl(u) { return /^(https:|http:\/\/localhost[:/])/.test(u || '') ? u : ''; }

function daysToChristmas() {
  const now = new Date();
  return Math.max(0, Math.ceil((new Date(now.getFullYear(), 11, 24) - now) / 864e5));
}
// Navidad se muestra solo con fecha límite escrita y mientras no haya pasado (ni ella ni el 24 de diciembre).
function christmasOn() {
  const s = settings(), now = new Date();
  if (!s.navidad_fecha_limite) return false;
  if (now.getMonth() === 11 && now.getDate() > 24) return false;
  if (s.navidad_fecha_limite_iso && new Date(s.navidad_fecha_limite_iso + 'T23:59:59') < now) return false;
  return true;
}
// Reemplaza {tokens} con datos de la hoja. Si un token queda vacío devuelve null y la pieza no se muestra
// (así un aviso como "Envíos en Lima: {envio_lima}" no sale a medias).
function fill(text) {
  if (!text) return '';
  let missing = false;
  const out = String(text).replace(/\{([a-z_]+)(?::([\w-]+))?\}/g, (m, key, arg) => {
    let v = '';
    if (key === 'dias_navidad') v = christmasOn() ? String(daysToChristmas()) : '';
    else if (key === 'fecha_limite') v = christmasOn() ? settings().navidad_fecha_limite : '';
    else if (key === 'precio') { const p = byId(arg); v = p ? priceLabel(p) : ''; }
    else v = settings()[key] || '';
    if (!v) missing = true;
    return v;
  });
  return missing ? null : out;
}
function waUrl(text) {
  const n = settings().whatsapp;
  return n ? 'https:' + '//wa.me/' + n + '?text=' + encodeURIComponent(text) : '';
}
// Destino de un botón escrito en la hoja: id de producto, ámbito, tienda, lindiland o whatsapp.
function dest(to) {
  const t = String(to || '').trim().toLowerCase();
  if (!t || t === 'tienda') return '#/tienda';
  if (t === 'lindiland') return '#/lindiland';
  if (t === 'whatsapp') return waUrl('Hola, Lindi. ') || '#/como-pedir';
  if (t === 'como-pedir' || t === 'pedir') return '#/como-pedir';
  const sc = SCOPES.find(s => s.id === t);
  if (sc) return '#/tienda/' + sc.id;
  return byId(to) ? '#/p/' + encodeURIComponent(to) : '#/tienda';
}
function linkAttrs(href) {

// Lindi: cabeza amarilla con carita, cuerpo cápsula, bracitos y piernitas (manual, sección 14).
function charHtml(color, pose, acc, scale) {
  const P = POSES[pose] || POSES.quieto;
  const body = CHAR_BODY[color] || CHAR_BODY.coral, limb = CHAR_LIMB[color] || CHAR_LIMB.coral;
  const laugh = pose === 'salta' || pose === 'celebra';
  const ring = color === 'amarillo' ? 'box-shadow:inset 0 0 0 2.5px #DDAA34;' : '';
  const eyes = laugh
    ? '<span style="left:10px;top:23px;width:9px;height:5px;border:2.5px solid #4A3732;border-bottom:none;border-radius:5px 5px 0 0"></span><span style="left:29px;top:23px;width:9px;height:5px;border:2.5px solid #4A3732;border-bottom:none;border-radius:5px 5px 0 0"></span>'
    : '<span style="left:11.5px;top:23.5px;width:6px;height:6px;border-radius:50%;background:#4A3732"></span><span style="left:30.5px;top:23.5px;width:6px;height:6px;border-radius:50%;background:#4A3732"></span>';
  const mouth = laugh
    ? '<span style="left:16.5px;top:31px;width:15px;height:8px;border-radius:2px 2px 15px 15px;background:#4A3732"></span>'
    : '<span style="left:16px;top:31px;width:16px;height:7px;border:3.5px solid #4A3732;border-top:none;border-radius:0 0 16px 16px"></span>';
  const spark = acc ? '' : '<span style="left:45px;top:-12px;width:6px;height:13px;border-radius:3px;background:#C85A3C;transform:rotate(28deg)"></span><span style="left:53px;top:0;width:6px;height:10px;border-radius:3px;background:#C85A3C;transform:rotate(66deg)"></span>';
  const limbStyle = 'width:11px;border-radius:5.5px;background:' + limb + ';z-index:-1;';
  return '<span class="char" aria-hidden="true" style="zoom:' + (scale || 1) + '">' +
    (pose === 'salta' || pose === 'sentado' ? '<span class="shadow"></span>' : '') +
    '<span class="fig" style="transform:' + P[4] + '">' +
    '<span class="head" style="' + ring + '">' + spark + eyes +
    '<span style="left:4.5px;top:31px;width:6.5px;height:4px;border-radius:50%;background:#E3714F"></span><span style="right:4.5px;top:31px;width:6.5px;height:4px;border-radius:50%;background:#E3714F"></span>' +
    mouth + (ACCESSORY[acc] || '') + '</span>' +
    '<span class="body" style="background:' + body + ';' + ring + '">' +
    '<span style="' + limbStyle + 'left:-2px;top:11px;height:34px;transform-origin:5.5px 5.5px;transform:rotate(' + P[0] + 'deg)"></span>' +
    '<span style="' + limbStyle + 'left:31px;top:11px;height:34px;transform-origin:5.5px 5.5px;transform:rotate(' + P[1] + 'deg)"></span>' +
    '<span style="' + limbStyle + 'left:5px;bottom:-16px;height:22px;transform-origin:5.5px 0;transform:rotate(' + P[2] + 'deg)"></span>' +
    '<span style="' + limbStyle + 'left:24px;bottom:-16px;height:22px;transform-origin:5.5px 0;transform:rotate(' + P[3] + 'deg)"></span>' +
    '</span></span></span>';
}
function isoHtml() {
  return '<span aria-hidden="true" style="position:relative;display:block;width:22px;height:36px"><span style="position:absolute;left:4px;top:13px;width:14px;height:23px;border-radius:7px;background:var(--crema)"></span><span style="position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--amarillo)"></span><span style="position:absolute;left:5px;top:9px;width:3px;height:3px;border-radius:50%;background:var(--cacao)"></span><span style="position:absolute;right:5px;top:9px;width:3px;height:3px;border-radius:50%;background:var(--cacao)"></span><span style="position:absolute;left:7.5px;top:13px;width:7px;height:3.5px;border:1.6px solid var(--cacao);border-top:none;border-radius:0 0 7px 7px"></span></span>';
}
function pastel(c) { return 'var(--' + c + '-p)'; }
// Foto de la hoja o, si falta, rayitas del color con Lindi: nunca un hueco ni un "foto pendiente".
// Lindi nunca va sobre su mismo color (manual, sección 11): coral, salvo sobre rayitas coral o rosa.
function photoHtml(url, alt, c, pose, acc, scale) {
  const u = safeUrl(url);
  const body = c === 'coral' || c === 'rosa' ? 'amarillo' : 'coral';
  const fallback = '<span class="rayas" style="--rp:' + pastel(c || 'amarillo') + '"></span>' + (pose ? '<span class="ph-char">' + charHtml(body, pose, acc || '', scale || 1) + '</span>' : '');
  if (!u) return fallback;
  return '<img src="' + escapeHtml(u) + '" alt="' + escapeHtml(alt || '') + '" loading="lazy" referrerpolicy="no-referrer" data-fb="' + escapeHtml(JSON.stringify([c || 'amarillo', pose || '', acc || '', scale || 1])) + '">';
}

// ---------- Pedido (lista guardada en este equipo) ----------

function saveList() { writeStore(STORE_LIST, state.list); paintBubble(); }
function lineOf(id) { return state.list.find(l => l.id === id); }
function addToList(id, qty, choice) {
  const line = lineOf(id);
  if (line && line.qty >= MAX_QTY) { state.notice = 'Puedes pedir hasta ' + MAX_QTY + ' de cada producto. Si necesitas más, cuéntanos en la nota.'; return false; }
  // Otra elección para el mismo producto se suma a la anterior (2 lazos rojos + 1 azul), no la reemplaza.
  if (line) { line.qty = Math.min(MAX_QTY, line.qty + qty); if (choice && line.choice.indexOf(choice) < 0) line.choice = (line.choice ? line.choice + ' + ' : '') + qty + ': ' + choice; }
  else if (state.list.length < MAX_LINES) state.list.push({ id: id, qty: Math.min(MAX_QTY, qty), choice: choice || '' });
  else { state.notice = 'Tu pedido ya tiene ' + MAX_LINES + ' productos distintos. Envía este y luego arma otro.'; return false; }
  saveList();
  return true;
}
function setQty(id, qty) {
  const line = lineOf(id);
  if (!line) return;
  if (qty <= 0) state.list = state.list.filter(l => l.id !== id);
  else line.qty = Math.min(MAX_QTY, qty);
  saveList();
}
function listCount() { return state.list.reduce((s, l) => s + l.qty, 0); }
function listTotal() {
  let sum = 0, pending = false;
  state.list.forEach(l => { const p = byId(l.id); if (!p) return; if (p.price) sum += p.price * l.qty; else pending = true; });
  return { sum: sum, pending: pending, label: sum ? money(sum) + (pending ? ' + por confirmar' : '') : 'Por confirmar' };
}
// Si un producto dejó de publicarse, sale del pedido y se avisa una vez.
function pruneList() {
  if (!state.content) return;
  const before = state.list.length;
  state.list = state.list.filter(l => byId(l.id));
  if (state.list.length !== before) { state.notice = 'Quitamos de tu pedido lo que ya no está disponible.'; saveList(); }
}
function paintBubble() {
  const el = document.getElementById('bubble');
  const r = route()[0];
  const n = listCount();
  const wa = waUrl('Hola, Lindi. ');
  const hide = !state.content || r === 'pedido' || r === 'listo' || (!n && !wa);
  el.hidden = hide;
  document.body.classList.toggle('has-bubble', !hide);
  if (hide) return;
  const narrow = innerWidth < 520;
  el.innerHTML = n
    ? '<a class="iso" href="#/pedido" aria-label="Ver tu pedido">' + isoHtml() + '<span class="count">' + n + '</span></a>' +
      '<a class="sum" href="#/pedido"><small>TU PEDIDO</small><b>' + escapeHtml(listTotal().label) + '</b></a>' +
      '<button class="clear" data-act="clear" aria-label="Vaciar pedido">' + (narrow ? '✕' : 'Vaciar') + '</button>' +
      '<button class="btn" data-act="send">' + (narrow ? 'Enviar' : 'Enviar por WhatsApp') + '</button>'
    : '<span class="iso">' + isoHtml() + '</span><a class="ask" ' + linkAttrs(wa) + '>¿Dudas? Escríbenos</a>';
}

// ---------- Contenido desde la hoja ----------

async function loadContent() {
  if (!CONFIG.api) { render(); return; }
  const cached = readStore(STORE_CONTENT, null);
  if (cached && cached.items) { setContent(cached); render(); }
  try {
    const res = await fetchWithTimeout(CONFIG.api + '?a=contenido', {}, 15000);
    const data = await res.json();
    if (!data.ok || !Array.isArray(data.items)) throw new Error('contenido');
    const c = { items: data.items, slides: data.slides || [], settings: data.settings || {} };
    writeStore(STORE_CONTENT, c);
    setContent(c);
    state.failed = false;
  } catch (e) {
    if (!state.content) state.failed = true;
  }
  const first = !document.getElementById('pedir') && !document.getElementById('carta');
  render();
  if (first) scrollToTarget();
}
function setContent(c) {
  state.content = c;
  // Vista previa de la otra opción de fondo sin tocar la hoja: ?fondo=crema o ?fondo=blanco.
  const q = (location.search.match(/[?&]fondo=(blanco|crema|mixto)/) || [])[1];
  const f = c.settings && c.settings.fondo;
  document.documentElement.dataset.fondo = q || (f === 'blanco' || f === 'mixto' ? f : 'crema');
  pruneList();
}
function fetchWithTimeout(url, opts, ms) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, Object.assign({ signal: ctrl.signal, redirect: 'follow' }, opts)).finally(() => clearTimeout(timer));
}

// Foto de Drive que no carga (sin compartir, borrada): se cambia por las rayitas.
function wireImages(root) {
  if (!root) return;
  root.querySelectorAll('img[data-fb]').forEach(img => {
    const swap = () => { const f = JSON.parse(img.dataset.fb); img.outerHTML = photoHtml('', '', f[0], f[1], f[2], f[3]); };
    if (img.complete && !img.naturalWidth) swap();
    else img.addEventListener('error', swap, { once: true });
  });
}

  state.slide = (state.slide + step + n) % n;
  const hero = document.getElementById('hero');
  if (!hero) return;
  hero.outerHTML = heroHtml();
  wireImages(document.getElementById('hero'));

function nextAnn(step) {
  state.ann += step;

// Avance automático: se detiene con el botón de pausa, con el mouse encima o con el foco del teclado
// dentro (WCAG 2.2.2), y vuelve a contar desde cero tras un cambio manual.
let pointerOnHero = false;
let slideTimer = null;
function restartTimer() {
  clearInterval(slideTimer);
  slideTimer = setInterval(() => {
    if (route()[0] !== 'home' || document.hidden || state.paused || pointerOnHero) return;
    const a = document.activeElement;
    if (a && a.closest && a.closest('#hero, #ann')) return;
    nextSlide(1);
    nextAnn(1);
  }, SLIDE_MS);
}
document.addEventListener('mouseover', ev => { pointerOnHero = !!ev.target.closest('#hero, #ann'); });
restartTimer();

// ---------- Enviar pedido ----------

// El mensaje termina en "Mi distrito:" para que el cliente lo complete en el chat, sin formulario previo.
function buildMessage(lines, total, pending, code) {
  const out = ['¡Hola, Lindi! Quiero hacer este pedido:', ''];
  lines.forEach(i => {
    out.push('• ' + i.qty + ' × ' + i.name + ' · ' + (i.price ? money(i.price * i.qty) : 'precio por confirmar'));
    if (i.choice) out.push('   ' + i.choice);
  });
  out.push('', 'Total: ' + (total ? money(total) + (pending ? ' + por confirmar' : '') : 'por confirmar'));
  // Referencia discreta para que la dueña encuentre la fila en Solicitudes; al azar, no dice cuántos pedidos hay.
  if (code) out.push('Ref. ' + code);
  out.push('', 'Mi distrito: ');
  return out.join('\n');
}

function showSendError(msg) {
  const err = document.getElementById('form-err');
  if (err) err.textContent = msg;
  else { state.notice = msg; render(); }
}

// Un toque: desde Tu pedido, la burbuja o la ficha. Anota la solicitud y abre WhatsApp.
async function sendOrder(btn) {
  if (!state.list.length) return;
  if (!settings().whatsapp) { showSendError('Los pedidos todavía no están abiertos.'); return; }
  const label = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Abriendo WhatsApp…'; }
  const payload = { items: state.list.map(l => ({ id: l.id, qty: l.qty, choice: l.choice })) };
  let res = null;
  try {
    const r = await fetchWithTimeout(CONFIG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) }, 15000);
    res = await r.json();
  } catch (e) {
    res = null;
  }
  // Un rechazo por datos (nombre, producto retirado) se muestra. Si la hoja no responde o no pudo anotarlo
  // (retry: ocupada, topes), igual se abre WhatsApp sin código: un pedido real nunca se pierde por la hoja.
  if (res && !res.ok && !res.retry) {
    if (btn && btn.isConnected) { btn.disabled = false; btn.textContent = label; }
    showSendError(res.error || 'No se pudo enviar el pedido.');
    return;
  }
  if (res && !res.ok) res = null;
  const choices = {};
  state.list.forEach(l => { choices[l.id] = (l.choice || '').trim(); });
  const lines = res && Array.isArray(res.items) && res.items.length
    ? res.items.map(i => Object.assign({}, i, { choice: choices[i.id] || '' }))
    : state.list.filter(l => byId(l.id)).map(l => { const p = byId(l.id); return { id: l.id, name: p.name, qty: l.qty, price: p.price, choice: choices[l.id] || '' }; });
  const total = res && typeof res.total === 'number' ? res.total : lines.reduce((s, i) => s + i.price * i.qty, 0);
  const pending = lines.some(i => !i.price);
  const code = (res && res.code) || '';
  const url = waUrl(buildMessage(lines, total, pending, code));
  writeStore(STORE_LAST, { code: code, url: url, at: Date.now() });
  state.list = [];
  saveList();
  location.hash = '#/listo';
  location.href = url;
}

const ACTIONS = {
  add(el) { addToList(el.dataset.id, 1); render(); },
  plus(el) { const l = lineOf(el.dataset.id); setQty(el.dataset.id, l.qty + 1); render(); },
  minus(el) { const l = lineOf(el.dataset.id); setQty(el.dataset.id, l.qty - 1); render(); },
  remove(el) { setQty(el.dataset.id, 0); render(); },
  clear() { state.list = []; saveList(); render(); },
  retry() { state.failed = false; render(); loadContent(); },
  slide(el) { nextSlide(Number(el.dataset.i) - state.slide); restartTimer(); },
  pause() { state.paused = !state.paused; nextSlide(0); },
  annNext() { nextAnn(1); restartTimer(); },
  annPrev() { nextAnn(-1); restartTimer(); },
  carta() { state.carta = !state.carta; render(); },
  photo(el) { state.photo = Number(el.dataset.i); render(); },
  pdPlus() { state.qty = Math.min(MAX_QTY, state.qty + 1); render(); },
  pdMinus() { state.qty = Math.max(1, state.qty - 1); render(); },
  pdAdd(el) { if (addToList(el.dataset.id, state.qty, state.note.trim())) { state.qty = 1; state.note = ''; } render(); },
  pdBuy(el) { if (addToList(el.dataset.id, state.qty, state.note.trim())) { state.qty = 1; state.note = ''; sendOrder(el); } else render(); },
  send(el) { sendOrder(el); }
};

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (el && ACTIONS[el.dataset.act]) {
    ev.preventDefault();
    const act = el.dataset.act, id = el.dataset.id, i = el.dataset.i;
    ACTIONS[act](el);
    // Cada acción vuelve a pintar: se devuelve el foco al mismo botón para teclado y lector de pantalla.
    const same = Array.from(document.querySelectorAll('[data-act="' + act + '"]')).find(x => x.dataset.id === id && x.dataset.i === i);
    if (same && document.activeElement !== same) same.focus({ preventScroll: true });
    return;
  }
  // El menú del celular se cierra al elegir un enlace.
  if (ev.target.closest('#links a')) toggleMenu(false);
});
function toggleMenu(open) {
  document.getElementById('links').classList.toggle('open', open);
  document.getElementById('menu-btn').setAttribute('aria-expanded', String(open));
}
document.getElementById('menu-btn').addEventListener('click', () => toggleMenu(!document.getElementById('links').classList.contains('open')));
document.addEventListener('input', ev => {
  if (ev.target.id === 'pd-note') { state.note = ev.target.value.slice(0, 200); return; }
  const id = ev.target.dataset && ev.target.dataset.choice;
  if (!id) return;
  const line = lineOf(id);
  if (line) { line.choice = ev.target.value.slice(0, 200); writeStore(STORE_LIST, state.list); }
});
window.addEventListener('hashchange', () => {
  state.notice = ''; state.photo = 0; state.qty = 1; state.note = '';
  if (location.hash === '#/carta') state.carta = true;
  toggleMenu(false);
  render();
  if (!scrollToTarget()) window.scrollTo(0, 0);
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') toggleMenu(false); });
// #/carta y #/como-pedir bajan a su sección (también al abrir el enlace directo, cuando ya cargó el contenido).
function scrollToTarget() {
  const target = location.hash === '#/carta' ? 'carta' : location.hash === '#/como-pedir' ? 'pedir' : '';
  if (target) setTimeout(() => { const el = document.getElementById(target); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 60);
  return !!target;
}
window.addEventListener('storage', ev => { if (ev.key === STORE_LIST) { state.list = readStore(STORE_LIST, []); pruneList(); render(); } });
window.addEventListener('resize', paintBubble);

document.getElementById('nav-logo').innerHTML = logoHtml(56);
if (location.hash === '#/carta') state.carta = true;
render();
loadContent();
</script>
</body>
